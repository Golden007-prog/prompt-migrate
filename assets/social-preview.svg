<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">PromptMigrate</title>
  <desc id="desc">Alembic-style migrations for LLM prompts and AI agents. Open source Python CLI.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1626"/>
      <stop offset="1" stop-color="#18253c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#a8b8d0" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
  </defs>
  <!-- square corners: GitHub crops and rounds social cards itself -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <ellipse cx="500" cy="250" rx="300" ry="140" fill="#38bdf8" opacity=".10" filter="url(#glow)"/>
  <ellipse cx="800" cy="400" rx="300" ry="140" fill="#8b5cf6" opacity=".12" filter="url(#glow)"/>

  <!-- logo mark: three revision lines with a dashed history rail -->
  <g transform="translate(586 130) scale(3)">
    <rect width="36" height="36" rx="10" fill="#172a40" stroke="#53657f"/>
    <path d="M10 12h15M10 18h10M10 24h12" fill="none" stroke="url(#accent)" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M25 10v18" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2 3"/>
    <circle cx="25" cy="12" r="2" fill="#7dd3fc"/>
    <circle cx="25" cy="26" r="2" fill="#a78bfa"/>
  </g>

  <g font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" text-anchor="middle">
    <text x="640" y="358" fill="#f4f7fb" font-size="100" font-weight="750" letter-spacing="-3">Prompt<tspan fill="url(#accent)">Migrate</tspan></text>
    <text x="640" y="424" fill="#c3d0e0" font-size="34" font-weight="450">Alembic-style migrations for LLM prompts &amp; AI agents</text>
    <text x="640" y="500" fill="#7d90aa" font-size="20" font-weight="600" letter-spacing="3">OPEN SOURCE · PYTHON CLI</text>
  </g>
</svg>
