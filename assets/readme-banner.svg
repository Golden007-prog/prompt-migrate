<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">PromptMigrate</title>
  <desc id="desc">Alembic-style migrations for LLM prompts and AI agents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1626"/>
      <stop offset="1" stop-color="#18253c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#a8b8d0" stroke-opacity=".05" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="24" fill="url(#grid)"/>
  <ellipse cx="520" cy="120" rx="220" ry="90" fill="#38bdf8" opacity=".10" filter="url(#glow)"/>
  <ellipse cx="780" cy="200" rx="220" ry="90" fill="#8b5cf6" opacity=".12" filter="url(#glow)"/>

  <!-- logo mark: three revision lines with a dashed history rail -->
  <g transform="translate(613 46) scale(1.5)">
    <rect width="36" height="36" rx="10" fill="#172a40" stroke="#53657f"/>
    <path d="M10 12h15M10 18h10M10 24h12" fill="none" stroke="url(#accent)" stroke-width="2.4" stroke-linecap="round"/>
    <path d="M25 10v18" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2 3"/>
    <circle cx="25" cy="12" r="2" fill="#7dd3fc"/>
    <circle cx="25" cy="26" r="2" fill="#a78bfa"/>
  </g>

  <g font-family="Inter, Segoe UI, Helvetica Neue, Arial, sans-serif" text-anchor="middle">
    <text x="640" y="190" fill="#f4f7fb" font-size="68" font-weight="750" letter-spacing="-2">Prompt<tspan fill="url(#accent)">Migrate</tspan></text>
    <text x="640" y="240" fill="#c3d0e0" font-size="23" font-weight="450">Alembic-style migrations for LLM prompts &amp; AI agents</text>
  </g>
</svg>
